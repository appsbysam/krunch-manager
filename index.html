<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#253c2c"><link rel="manifest" href="manifest.webmanifest"><title>KRUNCH Manager</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1e2d22;background:#f4f5f1}*{box-sizing:border-box}body{margin:0}header{background:#253c2c;color:white;padding:20px}main{max-width:950px;margin:auto;padding:18px}.sub{opacity:.75;font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,section{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}.big{font-size:26px;font-weight:750}button,input,select,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #cad2c9}button{background:#253c2c;color:white;cursor:pointer}button.secondary{background:white;color:#253c2c}.actions{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea{width:100%}label{display:block;font-size:13px;margin:9px 0 3px}article{padding:12px 0;border-bottom:1px solid #eee}article:last-child{border:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:12px;background:#e9ede6;padding:5px 8px;border-radius:20px}.muted{color:#69766d;font-size:13px}dialog{border:0;border-radius:14px;width:min(95vw,520px);max-height:90vh;overflow:auto}dialog::backdrop{background:#0008}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div class="row"><div><strong style="font-size:23px">KRUNCH Manager</strong><div class="sub">Fit-out & operations</div></div><span class="sub">Local prototype</span></div></header><main><div class="cards" id="stats"></div><section><div class="row"><h2>Project items</h2><button id="add">+ Add item</button></div><div class="actions"><select id="area"><option value="">All areas</option><option>Outdoor</option><option>Front of House</option><option>Kitchen / Back of House</option></select><select id="status"><option value="">All statuses</option><option>Not started</option><option>In progress</option><option>Completed</option></select></div><p><input id="search" placeholder="Search tasks, suppliers, equipment…"></p><div id="items"></div></section><section><h2>Backup & export</h2><p class="muted">This version saves to this browser only. It does not yet sync between Sam and Allan. Export backups regularly. Do not store sensitive documents in a public repository.</p><div class="actions"><button id="json">Export JSON</button><button id="csv" class="secondary">Export CSV</button><button id="restore" class="secondary">Import JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div></section></main><dialog id="editor"><form method="dialog" id="form"><h2 id="formtitle">Item</h2><input type="hidden" id="id"><label>Item / task</label><input id="name" required><label>Main area</label><select id="editarea"><option>Outdoor</option><option>Front of House</option><option>Kitchen / Back of House</option></select><label>Subcategory</label><input id="category"><label>Status</label><select id="editstatus"><option>Not started</option><option>In progress</option><option>Completed</option></select><label>Assigned to</label><input id="owner"><label>Supplier</label><input id="supplier"><label>Estimated cost (AUD)</label><input id="estimate" type="number" min="0" step=".01"><label>Actual cost (AUD)</label><input id="actual" type="number" min="0" step=".01"><label>Notes</label><textarea id="notes" rows="3"></textarea><p class="actions"><button type="submit" value="save">Save item</button><button type="button" class="secondary" id="cancel">Cancel</button><button type="button" class="secondary" id="delete">Delete</button></p></form></dialog><script>
const key="krunch-manager-items-v1";let items=[];try{items=JSON.parse(localStorage.getItem(key)||"[]");if(!Array.isArray(items))items=[]}catch{}const $=x=>document.getElementById(x);const save=()=>{localStorage.setItem(key,JSON.stringify(items));render()};const money=n=>new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0}).format(Number(n)||0);const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(){let completed=items.filter(x=>x.status==="Completed").length;let stats=[["Items",items.length],["Completed",completed],["Est. budget",money(items.reduce((a,x)=>a+(+x.estimate||0),0))],["Actual spend",money(items.reduce((a,x)=>a+(+x.actual||0),0))]];$("stats").innerHTML=stats.map(([a,b])=>'<div class="card"><div class="muted">'+a+'</div><div class="big">'+b+'</div></div>').join("");let q=$("search").value.toLowerCase(),a=$("area").value,s=$("status").value;let shown=items.filter(x=>(!a||x.area===a)&&(!s||x.status===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$("items").innerHTML=shown.length?shown.map(x=>'<article class="row"><div><strong>'+escape(x.name)+'</strong><div class="muted">'+escape(x.area)+' · '+escape(x.category||"General")+' · '+escape(x.owner||"Unassigned")+'</div><div class="muted">'+escape(x.supplier||"")+' '+(x.estimate?' · Est. '+money(x.estimate):"")+'</div></div><div><span class="tag">'+escape(x.status)+'</span><p><button class="secondary" data-id="'+escape(x.id)+'">Edit</button></p></div></article>').join(""):'<p class="muted">No items here yet. Add your first task or import your saved data.</p>';$("items").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>edit(b.dataset.id))}function edit(id){let x=items.find(x=>x.id===id)||{};$("formtitle").textContent=id?"Edit item":"Add item";for(let [f,v] of Object.entries({id:x.id||"",name:x.name||"",editarea:x.area||"Outdoor",category:x.category||"",editstatus:x.status||"Not started",owner:x.owner||"",supplier:x.supplier||"",estimate:x.estimate||"",actual:x.actual||"",notes:x.notes||""}))$(f).value=v;$("delete").hidden=!id;$("editor").showModal()}$("add").onclick=()=>edit();$("cancel").onclick=()=>$("editor").close();$("form").onsubmit=e=>{e.preventDefault();let id=$("id").value||("item-"+Date.now()+"-"+Math.random().toString(36).slice(2));let x={id,name:$("name").value.trim(),area:$("editarea").value,category:$("category").value,status:$("editstatus").value,owner:$("owner").value,supplier:$("supplier").value,estimate:Number($("estimate").value)||0,actual:Number($("actual").value)||0,notes:$("notes").value};if(!x.name)return;items=items.filter(y=>y.id!==id).concat(x);save();$("editor").close()};$("delete").onclick=()=>{let id=$("id").value;if(confirm("Delete this item?")){items=items.filter(x=>x.id!==id);save();$("editor").close()}};["area","status","search"].forEach(k=>$(k).addEventListener("input",render));function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("json").onclick=()=>download("krunch-backup.json",JSON.stringify(items,null,2),"application/json");$("csv").onclick=()=>{let fields=["id","name","area","category","status","owner","supplier","estimate","actual","notes"];let csv=[fields.join(","),...items.map(x=>fields.map(f=>'"'+String(x[f]??"").replaceAll('"','""')+'"').join(","))].join("\r\n");download("krunch-items.csv",csv,"text/csv")};$("restore").onclick=()=>$("file").click();$("file").onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(x=>x&&typeof x.name==="string"))throw Error("Invalid backup");if(confirm("Replace existing items with "+data.length+" imported items?")){items=data;save()}}catch(err){alert("Import failed: "+err.message)}e.target.value=""};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});render();
</script></body></html>
